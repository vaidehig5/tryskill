<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TrySkill{% endblock %} | TrySkill</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
        <a class="brand" href="{{ url_for('home') }}">TrySkill</a>

        <nav aria-label="Main navigation">
            <ul class="nav-list">
                <li>
                    <a href="{{ url_for('home') }}"
                       {% if request.endpoint == 'home' %}class="active" aria-current="page"{% endif %}>Home</a>
                </li>
                <li>
                    <a href="{{ url_for('explore') }}"
                       {% if request.endpoint == 'explore' %}class="active" aria-current="page"{% endif %}>Explore</a>
                </li>
                <li>
                    <a href="{{ url_for('hobbies') }}"
                       {% if request.endpoint == 'hobbies' %}class="active" aria-current="page"{% endif %}>My Hobbies</a>
                </li>
                <li>
                    <a href="{{ url_for('profile') }}"
                       {% if request.endpoint == 'profile' %}class="active" aria-current="page"{% endif %}>Profile</a>
                </li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
